services:
  db:
    image: postgis/postgis:17-3.5
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  elt:
    build: ./elt
    env_file: .env
    environment:
      DXB_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./elt/src:/app/src # dev: live code without rebuild
      - ./data:/app/data:ro # one-off CSV import source files (see docs/CSV_DATA_ANALYSIS.md)
    command: dxb run-scheduler

volumes:
  pgdata:
